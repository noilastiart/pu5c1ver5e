<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified - PUSCIVERSE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .monitor-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 4/3;
            background: url('https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/D9D-Division.png') no-repeat center center;
            background-size: contain;
        }

        .screen-area {
            position: absolute;
            top: 8%;
            left: 10.5%;
            width: 79%;
            height: 79%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            overflow: hidden;
        }

        .document-image {
            display: none;
        }

        .d9d-link:hover {
            background: rgba(57, 255, 20, 0.1);
        }

        /* D9D Division clickable area - top center where circled */
        .d9d-link {
            position: absolute;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            width: 18%;
            height: 6%;
            cursor: pointer;
            z-index: 5;
        }

        .d9d-link:hover {
            background: rgba(57, 255, 20, 0.1);
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <div class="screen-area">
            <img src="https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/assinvestigator.png" alt="Classified Document" class="document-image">
            <a href="contact.html" class="d9d-link" title="D9D Division"></a>
        </div>
    </div>
</body>
</html>
