<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified - PUSCIVERSE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .monitor-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 4/3;
            background: url('https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/D9D-Division.png') no-repeat center center;
            background-size: contain;
        }

        .screen-area {
            position: absolute;
            top: 8%;
            left: 10.5%;
            width: 79%;
            height: 79%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            overflow: hidden;
        }

        .document-image {
            display: none;
        }

        /* Simple arrow button on the right side */
        .contact-button {
            position: absolute;
            top: 50%;
            right: 14%;
            transform: translateY(-50%);
            background: transparent;
            color: #39ff14;
            border: 2px solid #39ff14;
            padding: 10px 15px;
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 0 5px #39ff14;
            box-shadow: 0 0 5px #39ff14;
            text-decoration: none;
            display: inline-block;
            z-index: 10;
            line-height: 1;
        }

        .contact-button:hover {
            background: rgba(57, 255, 20, 0.2);
            box-shadow: 0 0 10px #39ff14;
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <div class="screen-area">
            <img src="https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/assinvestigator.png" alt="Classified Document" class="document-image">
            <a href="contact.html" class="contact-button">→</a>
        </div>
    </div>
</body>
</html>
