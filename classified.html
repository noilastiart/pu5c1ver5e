<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified - PUSCIVERSE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .monitor-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 4/3;
            background: url('https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/D9D-Division.png') no-repeat center center;
            background-size: contain;
        }

        .screen-area {
            position: absolute;
            top: 8%;
            left: 10.5%;
            width: 79%;
            height: 79%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            overflow: hidden;
        }

        .document-image {
            display: none;
        }

        .back-button {
            position: absolute;
            top: 50%;
            left: -60px;
            transform: translateY(-50%);
            background: transparent;
            color: #39ff14;
            border: 2px solid #39ff14;
            padding: 5px 12px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 0 5px #39ff14;
            box-shadow: 0 0 5px #39ff14;
            text-decoration: none;
            display: inline-block;
            z-index: 10;
            line-height: 1;
        }

        .back-button:hover {
            background: rgba(57, 255, 20, 0.1);
            box-shadow: 0 0 10px #39ff14;
        }

        /* D9D Division clickable area - left side middle where black box is */
        .d9d-link {
            position: absolute;
            top: 48%;
            left: 22%;
            transform: translateY(-50%);
            width: 12%;
            height: 10%;
            cursor: pointer;
            z-index: 5;
        }

        .d9d-link:hover {
            background: rgba(57, 255, 20, 0.1);
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <div class="screen-area">
            <a href="desktop.html" class="back-button">←</a>
            <img src="https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/assinvestigator.png" alt="Classified Document" class="document-image">
            <a href="contact.html" class="d9d-link" title="D9D Division"></a>
        </div>
    </div>
</body>
</html>
