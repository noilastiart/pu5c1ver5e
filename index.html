<!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUSCIVERSE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .monitor-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 4/3;
            background: url('https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/monitor.png') no-repeat center center;
            background-size: contain;
        }

        .screen-area {
            position: absolute;
            top: 8%;
            left: 10.5%;
            width: 79%;
            height: 79%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* UFO AND LANDING PAGE STYLES */
        .ufo {
            position: absolute;
            top: 26%;
            left: 49.5%;
            transform: translateX(-50%);
            width: 46%;
            max-width: 400px;
            opacity: 0;
            z-index: 3;
        }

        .ufo.visible {
            opacity: 1;
            animation: ufoHover 3s ease-in-out infinite;
        }

        @keyframes ufoHover {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .beam {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 100%;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        .beam img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .beam.visible {
            opacity: 1;
        }

        .password-container {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            z-index: 4;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        .password-container.visible {
            opacity: 1;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .password-label {
            color: #39ff14;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 8px #39ff14;
            letter-spacing: 2px;
            font-weight: normal;
        }

        .password-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #39ff14;
            color: #39ff14;
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            padding: 5px 10px;
            width: 100%;
            text-align: center;
            letter-spacing: 8px;
            text-transform: uppercase;
            outline: none;
            text-shadow: 0 0 5px #39ff14;
            caret-color: #39ff14;
        }

        .password-input::placeholder {
            color: rgba(57, 255, 20, 0.3);
            letter-spacing: 8px;
        }

        .password-input:focus {
            animation: cursorPulse 1.5s infinite;
        }

        @keyframes cursorPulse {
            0%, 100% { text-shadow: 0 0 5px #39ff14; }
            50% { text-shadow: 0 0 10px #39ff14, 0 0 15px #39ff14; }
        }

        .password-container.shake {
            animation: shake 0.5s !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%) translateX(0); }
            25% { transform: translateX(-50%) translateX(-10px); }
            50% { transform: translateX(-50%) translateX(0); }
            75% { transform: translateX(-50%) translateX(10px); }
        }

        .access-denied {
            color: #ff0000 !important;
            text-shadow: 0 0 10px #ff0000 !important;
        }

        /* VIDEO CONTAINER */
        .video-container {
            position: absolute;
            top: 8%;
            left: 10.5%;
            width: 79%;
            height: 79%;
            display: none;
            z-index: 5;
            background: #000;
        }

        .video-container.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
            background: #000;
        }

        /* DESKTOP EASTER EGG STYLES */
        .desktop-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 6;
        }

        .desktop-container.active {
            display: block;
        }

        .desktop-bg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: default;
        }

        /* Clickable folder hotspots */
        .folder-hotspot {
            position: absolute;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .folder-hotspot:hover {
            opacity: 0.8;
        }

        /* Dick's folder - top left */
        .dicks-folder {
            top: 15%;
            left: 10%;
            width: 12%;
            height: 15%;
        }

        /* TOP SECRET folder - right side */
        .topsecret-folder {
            top: 35%;
            right: 5%;
            width: 14%;
            height: 16%;
        }

        /* Epstein List folder - bottom left */
        .epstein-folder {
            bottom: 23%;
            left: 10%;
            width: 12%;
            height: 15%;
        }

        /* DOCUMENT VIEWER */
        .document-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 7;
            background: #000;
        }

        .document-viewer.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .document-image {
            max-width: 95%;
            max-height: 90%;
            object-fit: contain;
        }

        .back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #39ff14;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-shadow: none;
            box-shadow: 0 0 10px #39ff14;
            z-index: 10;
        }

        .back-button:hover {
            background: #2de000;
            box-shadow: 0 0 15px #39ff14;
        }

        /* D9D Division clickable area on classified doc */
        .d9d-hotspot {
            position: absolute;
            bottom: 8%;
            right: 8%;
            width: 15%;
            height: 8%;
            cursor: pointer;
            z-index: 8;
        }

        .d9d-hotspot:hover {
            background: rgba(57, 255, 20, 0.1);
        }

        /* CONTACT PAGE */
        .contact-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 9;
            background: #000;
            justify-content: center;
            align-items: center;
        }

        .contact-page.active {
            display: flex;
        }

        .contact-content {
            text-align: center;
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14;
            padding: 20px;
        }

        .contact-title {
            font-size: 2rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            animation: glitch 2s infinite;
        }

        .contact-clearance {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }

        .contact-info {
            font-size: 1.1rem;
            line-height: 2;
            letter-spacing: 1px;
        }

        .contact-label {
            color: #39ff14;
            opacity: 0.7;
        }

        .contact-value {
            color: #39ff14;
            font-weight: bold;
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 10px #39ff14; }
            25% { text-shadow: -2px 0 10px #39ff14, 2px 0 10px #ff0000; }
            50% { text-shadow: 2px 0 10px #39ff14, -2px 0 10px #0000ff; }
            75% { text-shadow: 0 0 10px #39ff14; }
        }

        @media (max-width: 768px) {
            .password-label {
                font-size: 0.9rem;
            }
            .password-input {
                font-size: 1rem;
                padding: 8px 15px;
            }
            .contact-title {
                font-size: 1.3rem;
            }
            .contact-clearance {
                font-size: 1rem;
            }
            .contact-info {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <div class="screen-area">
            <!-- LANDING PAGE -->
            <img src="https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/ufo.png" alt="UFO" class="ufo" id="ufo">
            
            <div class="beam" id="beam1"></div>
            <div class="beam" id="beam2"></div>
            <div class="beam" id="beam3"></div>
            <div class="beam" id="beam4"></div>
            <div class="beam" id="beam5"></div>
            <div class="beam" id="beam6"></div>
            <div class="beam" id="beam7"></div>
            <div class="beam" id="beam8"></div>
            
            <div class="password-container" id="passwordContainer">
                <div class="password-label" id="passwordLabel">ENTER ACCESS CODE:</div>
                <input type="text" class="password-input" id="passwordInput" maxlength="10" autocomplete="off">
            </div>

            <!-- VIDEO CONTAINER -->
            <div class="video-container" id="videoContainer"></div>

            <!-- DESKTOP EASTER EGG -->
            <div class="desktop-container" id="desktopContainer">
                <img src="https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/hanginthere.png" alt="Desktop" class="desktop-bg">
                
                <!-- Clickable folder hotspots -->
                <div class="folder-hotspot dicks-folder" id="dicksFolder" title="Dick's"></div>
                <div class="folder-hotspot topsecret-folder" id="topsecretFolder" title="TOP SECRET"></div>
                <div class="folder-hotspot epstein-folder" id="epsteinFolder" title="Epstein List"></div>
            </div>

            <!-- DOCUMENT VIEWERS -->
            <!-- Classified Document -->
            <div class="document-viewer" id="classifiedDoc">
                <button class="back-button" id="backFromClassified">← BACK</button>
                <img src="https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/assinvestigator.png" alt="Classified" class="document-image">
                <div class="d9d-hotspot" id="d9dHotspot" title="D9D Division"></div>
            </div>

            <!-- Romance Novel -->
            <div class="document-viewer" id="romanceDoc">
                <button class="back-button" id="backFromRomance">← BACK</button>
                <img src="https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/probedbylove.png" alt="Romance" class="document-image">
            </div>

            <!-- CONTACT PAGE -->
            <div class="contact-page" id="contactPage">
                <button class="back-button" id="backFromContact">← BACK</button>
                <div class="contact-content">
                    <div class="contact-title">D9D DIVISION</div>
                    <div class="contact-clearance">CLEARANCE LEVEL: CLASSIFIED</div>
                    <div class="contact-info">
                        <div><span class="contact-label">ASSIGNED INVESTIGATOR:</span></div>
                        <div><span class="contact-value">JAMES IFAN MONTGOMERY</span></div>
                        <br>
                        <div><span class="contact-label">EMAIL:</span> <span class="contact-value">DESCEND9DOWN@GMAIL.COM</span></div>
                        <br>
                        <div><span class="contact-label">PHONE:</span> <span class="contact-value">573.639.0109</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // LANDING PAGE ELEMENTS
        const ufo = document.getElementById('ufo');
        const passwordContainer = document.getElementById('passwordContainer');
        const passwordInput = document.getElementById('passwordInput');
        const passwordLabel = document.getElementById('passwordLabel');
        const videoContainer = document.getElementById('videoContainer');
        
        // DESKTOP ELEMENTS
        const desktopContainer = document.getElementById('desktopContainer');
        const dicksFolder = document.getElementById('dicksFolder');
        const topsecretFolder = document.getElementById('topsecretFolder');
        const epsteinFolder = document.getElementById('epsteinFolder');
        
        // DOCUMENT ELEMENTS
        const classifiedDoc = document.getElementById('classifiedDoc');
        const romanceDoc = document.getElementById('romanceDoc');
        const contactPage = document.getElementById('contactPage');
        
        // BUTTONS
        const backFromClassified = document.getElementById('backFromClassified');
        const backFromRomance = document.getElementById('backFromRomance');
        const backFromContact = document.getElementById('backFromContact');
        const d9dHotspot = document.getElementById('d9dHotspot');
        
        const beams = [
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-01.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-02.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-03.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-04.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-05.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-06.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-07.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-08.png'
        ];

        const beamElements = [
            document.getElementById('beam1'),
            document.getElementById('beam2'),
            document.getElementById('beam3'),
            document.getElementById('beam4'),
            document.getElementById('beam5'),
            document.getElementById('beam6'),
            document.getElementById('beam7'),
            document.getElementById('beam8')
        ];

        let currentBeam = 0;
        let beamInterval;
        let animationComplete = false;

        // LANDING PAGE ANIMATION
        setTimeout(() => {
            ufo.classList.add('visible');
            setTimeout(() => {
                startBeamAnimation();
            }, 2000);
        }, 1000);

        function startBeamAnimation() {
            beamInterval = setInterval(() => {
                beamElements.forEach(el => el.classList.remove('visible'));
                
                for (let i = 0; i <= currentBeam; i++) {
                    beamElements[i].innerHTML = `<img src="${beams[i]}" alt="Beam ${i + 1}">`;
                    beamElements[i].classList.add('visible');
                }
                
                currentBeam++;
                
                if (currentBeam >= beams.length) {
                    if (!animationComplete) {
                        animationComplete = true;
                        setTimeout(() => {
                            passwordContainer.classList.add('visible');
                            passwordInput.focus();
                        }, 500);
                    }
                    currentBeam = 0;
                }
            }, 200);
        }

        // PASSWORD HANDLING
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const password = passwordInput.value.toUpperCase();
                
                if (password === 'PROBE') {
                    clearInterval(beamInterval);
                    
                    ufo.style.display = 'none';
                    beamElements.forEach(el => el.style.display = 'none');
                    passwordContainer.style.display = 'none';
                    
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.controls = true;
                    video.style.width = '100%';
                    video.style.height = '100%';
                    video.style.objectFit = 'contain';
                    
                    const source = document.createElement('source');
                    const timestamp = new Date().getTime();
                    source.src = 'https://github.com/noilastiart/pu5c1ver5e/releases/download/vd02/pu5c1ver5e-teaser.mp4?v=' + timestamp;
                    source.type = 'video/mp4';
                    
                    video.appendChild(source);
                    videoContainer.innerHTML = '';
                    videoContainer.appendChild(video);
                    videoContainer.classList.add('active');
                    
                    // When video ends, show desktop
                    video.addEventListener('ended', () => {
                        videoContainer.classList.remove('active');
                        desktopContainer.classList.add('active');
                    });
                    
                    video.addEventListener('loadedmetadata', () => {
                        video.play().then(() => {
                            if (video.requestFullscreen) {
                                video.requestFullscreen();
                            } else if (video.webkitRequestFullscreen) {
                                video.webkitRequestFullscreen();
                            } else if (video.msRequestFullscreen) {
                                video.msRequestFullscreen();
                            }
                        });
                    });
                } else {
                    const originalText = passwordLabel.textContent;
                    passwordLabel.textContent = 'ACCESS DENIED';
                    passwordLabel.classList.add('access-denied');
                    passwordContainer.classList.add('shake');
                    
                    setTimeout(() => {
                        passwordLabel.textContent = originalText;
                        passwordLabel.classList.remove('access-denied');
                        passwordContainer.classList.remove('shake');
                        passwordInput.value = '';
                        passwordInput.focus();
                    }, 1500);
                }
            }
        });

        // DESKTOP FOLDER CLICKS
        dicksFolder.addEventListener('click', () => {
            desktopContainer.classList.remove('active');
            romanceDoc.classList.add('active');
        });

        topsecretFolder.addEventListener('click', () => {
            desktopContainer.classList.remove('active');
            classifiedDoc.classList.add('active');
        });

        epsteinFolder.addEventListener('click', () => {
            // Rickroll!
            window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank');
        });

        // D9D DIVISION CLICK
        d9dHotspot.addEventListener('click', () => {
            classifiedDoc.classList.remove('active');
            contactPage.classList.add('active');
        });

        // BACK BUTTONS
        backFromClassified.addEventListener('click', () => {
            classifiedDoc.classList.remove('active');
            desktopContainer.classList.add('active');
        });

        backFromRomance.addEventListener('click', () => {
            romanceDoc.classList.remove('active');
            desktopContainer.classList.add('active');
        });

        backFromContact.addEventListener('click', () => {
            contactPage.classList.remove('active');
            classifiedDoc.classList.add('active');
        });

        // Auto-focus on password input when visible
        const observer = new MutationObserver(() => {
            if (passwordContainer.classList.contains('visible')) {
                passwordInput.focus();
            }
        });
        observer.observe(passwordContainer, { attributes: true });
    </script>
</body>
</html>
