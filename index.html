<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUSCIVERSE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .monitor-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 4/3;
            background: url('https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/monitor.png') no-repeat center center;
            background-size: contain;
        }

        .screen-area {
            position: absolute;
            top: 8%;
            left: 10.5%;
            width: 79%;
            height: 79%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .ufo {
            position: absolute;
            top: 26%;
            left: 49.5%;
            transform: translateX(-50%);
            width: 46%;
            max-width: 400px;
            opacity: 0;
            z-index: 3;
        }

        .ufo.visible {
            opacity: 1;
            animation: ufoHover 3s ease-in-out infinite;
        }

        @keyframes ufoHover {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .beam {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 100%;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        .beam img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .beam.visible {
            opacity: 1;
        }

        .password-container {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            z-index: 4;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        .password-container.visible {
            opacity: 1;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        .password-label {
            color: #39ff14;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 8px #39ff14;
            letter-spacing: 2px;
            font-weight: normal;
        }

        .password-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #39ff14;
            color: #39ff14;
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            padding: 5px 10px;
            width: 100%;
            text-align: center;
            letter-spacing: 8px;
            text-transform: uppercase;
            outline: none;
            text-shadow: 0 0 5px #39ff14;
            caret-color: #39ff14;
        }

        .password-input::placeholder {
            color: rgba(57, 255, 20, 0.3);
            letter-spacing: 8px;
        }

        .password-input:focus {
            animation: cursorPulse 1.5s infinite;
        }

        @keyframes cursorPulse {
            0%, 100% { text-shadow: 0 0 5px #39ff14; }
            50% { text-shadow: 0 0 10px #39ff14, 0 0 15px #39ff14; }
        }

        .password-container.shake {
            animation: shake 0.5s !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%) translateX(0); }
            25% { transform: translateX(-50%) translateX(-10px); }
            50% { transform: translateX(-50%) translateX(0); }
            75% { transform: translateX(-50%) translateX(10px); }
        }

        .access-denied {
            color: #ff0000 !important;
            text-shadow: 0 0 10px #ff0000 !important;
        }

        .video-container {
            position: absolute;
            top: 8%;
            left: 10.5%;
            width: 79%;
            height: 79%;
            display: none;
            z-index: 5;
            background: #000;
            opacity: 0;
        }

        .video-container.active {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease-in forwards;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
            background: #000;
        }

        @media (max-width: 768px) {
            .password-label {
                font-size: 0.9rem;
            }
            .password-input {
                font-size: 1rem;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <div class="screen-area">
            <img src="https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/ufo.png" alt="UFO" class="ufo" id="ufo">
            
            <div class="beam" id="beam1"></div>
            <div class="beam" id="beam2"></div>
            <div class="beam" id="beam3"></div>
            <div class="beam" id="beam4"></div>
            <div class="beam" id="beam5"></div>
            <div class="beam" id="beam6"></div>
            <div class="beam" id="beam7"></div>
            <div class="beam" id="beam8"></div>
            
            <div class="password-container" id="passwordContainer">
                <div class="password-label" id="passwordLabel">ENTER ACCESS CODE:</div>
                <input type="text" class="password-input" id="passwordInput" maxlength="10" autocomplete="off">
            </div>

            <div class="video-container" id="videoContainer"></div>
        </div>
    </div>

    <script>
        const ufo = document.getElementById('ufo');
        const passwordContainer = document.getElementById('passwordContainer');
        const passwordInput = document.getElementById('passwordInput');
        const passwordLabel = document.getElementById('passwordLabel');
        const videoContainer = document.getElementById('videoContainer');
        
        const beams = [
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-01.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-02.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-03.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-04.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-05.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-06.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-07.png',
            'https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/beam-08.png'
        ];

        const beamElements = [
            document.getElementById('beam1'),
            document.getElementById('beam2'),
            document.getElementById('beam3'),
            document.getElementById('beam4'),
            document.getElementById('beam5'),
            document.getElementById('beam6'),
            document.getElementById('beam7'),
            document.getElementById('beam8')
        ];

        let currentBeam = 0;
        let beamInterval;
        let animationComplete = false;

        setTimeout(() => {
            ufo.classList.add('visible');
            setTimeout(() => {
                startBeamAnimation();
            }, 2000);
        }, 1000);

        function startBeamAnimation() {
            beamInterval = setInterval(() => {
                beamElements.forEach(el => el.classList.remove('visible'));
                
                for (let i = 0; i <= currentBeam; i++) {
                    beamElements[i].innerHTML = `<img src="${beams[i]}" alt="Beam ${i + 1}">`;
                    beamElements[i].classList.add('visible');
                }
                
                currentBeam++;
                
                if (currentBeam >= beams.length) {
                    if (!animationComplete) {
                        animationComplete = true;
                        setTimeout(() => {
                            passwordContainer.classList.add('visible');
                            passwordInput.focus();
                        }, 500);
                    }
                    currentBeam = 0;
                }
            }, 200);
        }

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const password = passwordInput.value.toUpperCase();
                
                if (password === 'PROBE') {
                    clearInterval(beamInterval);
                    
                    // Add fade-out class to all elements
                    ufo.classList.add('fade-out');
                    beamElements.forEach(el => el.classList.add('fade-out'));
                    passwordContainer.classList.add('fade-out');
                    
                    // Wait for fade-out to complete, then show video
                    setTimeout(() => {
                        ufo.style.display = 'none';
                        beamElements.forEach(el => el.style.display = 'none');
                        passwordContainer.style.display = 'none';
                        
                        const video = document.createElement('video');
                        video.autoplay = true;
                        video.controls = true;
                        video.style.width = '100%';
                        video.style.height = '100%';
                        video.style.objectFit = 'contain';
                        
                        const source = document.createElement('source');
                        const timestamp = new Date().getTime();
                        source.src = 'https://github.com/noilastiart/pu5c1ver5e/releases/download/vd02/pu5c1ver5e-teaser.mp4?v=' + timestamp;
                        source.type = 'video/mp4';
                        
                        video.appendChild(source);
                        videoContainer.innerHTML = '';
                        videoContainer.appendChild(video);
                        videoContainer.classList.add('active');
                        
                        // Redirect to desktop when video ends
                        video.addEventListener('ended', () => {
                            window.location.href = 'desktop.html';
                        });
                        
                        video.addEventListener('loadedmetadata', () => {
                            video.play().then(() => {
                                if (video.requestFullscreen) {
                                    video.requestFullscreen();
                                } else if (video.webkitRequestFullscreen) {
                                    video.webkitRequestFullscreen();
                                } else if (video.msRequestFullscreen) {
                                    video.msRequestFullscreen();
                                }
                            });
                        });
                    }, 500); // Wait for fade-out animation to complete
                } else {
                    const originalText = passwordLabel.textContent;
                    passwordLabel.textContent = 'ACCESS DENIED';
                    passwordLabel.classList.add('access-denied');
                    passwordContainer.classList.add('shake');
                    
                    setTimeout(() => {
                        passwordLabel.textContent = originalText;
                        passwordLabel.classList.remove('access-denied');
                        passwordContainer.classList.remove('shake');
                        passwordInput.value = '';
                        passwordInput.focus();
                    }, 1500);
                }
            }
        });

        const observer = new MutationObserver(() => {
            if (passwordContainer.classList.contains('visible')) {
                passwordInput.focus();
            }
        });
        observer.observe(passwordContainer, { attributes: true });
    </script>
</body>
</html>
