<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D9D Division - PUSCIVERSE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .monitor-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 4/3;
            background: url('https://raw.githubusercontent.com/noilastiart/pu5c1ver5e/main/D9D-contact.png') no-repeat center center;
            background-size: contain;
        }

        .screen-area {
            position: absolute;
            top: 8%;
            left: 10.5%;
            width: 79%;
            height: 79%;
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <div class="screen-area"></div>
    </div>
</body>
</html>
